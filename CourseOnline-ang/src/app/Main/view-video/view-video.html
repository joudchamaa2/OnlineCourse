<div class="min-h-screen bg-gray-100 flex items-center justify-center p-6">

  <div *ngFor="let v of video" class="bg-white shadow-2xl rounded-3xl p-8 w-full max-w-4xl">

    <!-- Page Title -->
    <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">
      Watch Video
    </h1>

    <!-- Video Player -->
    <div class="mb-6">
      <video
        controls
        class="w-full h-64 md:h-96 rounded-2xl shadow-lg bg-black"
      >
        <source [src]="'http://localhost:8000/assets/videos/'+v.video" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>

    <!-- Video Info -->
    <div class="mb-4">
      <h2 class="text-2xl font-semibold text-gray-800 mb-2">
        {{v.title}}
      </h2>
      <p class="text-gray-700">
        {{v.description}}
      </p>
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-end space-x-4 mt-6">
      <button
      [routerLink]="['/viewcourse',v.course_id]"
        class="bg-gray-400 text-white px-6 py-3 rounded-xl hover:bg-gray-500 transition"
      >
        Back
      </button>
      
    </div>

  </div>

</div>
