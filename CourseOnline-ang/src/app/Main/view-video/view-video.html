<div class="min-h-screen bg-gray-100 p-4 md:p-8">

  <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- LEFT: Video Player + Info -->
    <div class="lg:col-span-2 space-y-6">

      <!-- Video Player -->
      <div class="bg-black rounded-2xl overflow-hidden shadow-xl relative">
        <video
          *ngIf="video"
          controls
          [src]="'http://localhost:8000/assets/videos/' + video.video"
          class="w-full h-72 md:h-[450px] object-cover"
        ></video>

        <div class="absolute top-4 left-4 bg-indigo-600 text-white px-3 py-1 rounded-full text-xs font-semibold shadow">
          Now Playing
        </div>
      </div>

      <!-- Video Info -->
      <div class="bg-white rounded-2xl shadow-lg p-6 space-y-4">

        <h1 class="text-2xl md:text-3xl font-bold text-gray-900">
          {{ video.title }}
        </h1>

        <p class="text-gray-600">
          {{ video.description }}
        </p>

        <!-- Doctor -->
        <div class="flex items-center gap-4 mt-4">
          <img 
            src="https://ui-avatars.com/api/?name={{ video.user.name }}&background=6366F1&color=fff&size=64"
            alt="{{ video.user.name }}"
            class="w-12 h-12 rounded-full shadow"
          />
          <div>
            <p class="font-semibold text-gray-900">{{ video.user.name }}</p>
            <p class="text-sm text-gray-500">{{ video.user.role }}</p>
          </div>
        </div>

        <!-- Back -->
        <div class="pt-4">
          <button
            [routerLink]="['/viewcourse', video.course_id]"
            class="bg-gray-800 hover:bg-black text-white px-5 py-2 rounded-xl transition">
            ← Back to Course
          </button>
        </div>

      </div>

    </div>

    <!-- RIGHT: Sidebar Videos -->
    <div class="bg-white rounded-2xl shadow-lg p-4 h-[600px] overflow-y-auto">

      <h2 class="text-lg font-bold text-gray-900 mb-4">
        Course Videos
      </h2>

      <div class="space-y-3">

        <div *ngFor="let v of videoscourse"
             class="flex gap-3 p-3 rounded-xl hover:bg-gray-100 cursor-pointer transition group"
             [class.bg-gray-200]="v.id === video.id">

          <!-- Thumbnail -->

          <!-- Info -->
          <div class="flex-1">
            <h3 class="text-sm font-semibold text-gray-800 line-clamp-1">
              {{ v.title }}
            </h3>
            <p class="text-xs text-gray-500 line-clamp-2">
              {{ v.description }}
            </p>
          </div>

          <!-- Play -->
          <button
            [routerLink]="['/viewvideo', v.id]"
            class="text-indigo-600 hover:text-indigo-800 font-bold">
            ▶
          </button>

        </div>

      </div>

    </div>

  </div>

</div>
