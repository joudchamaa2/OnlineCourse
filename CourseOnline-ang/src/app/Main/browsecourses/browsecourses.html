<div class="min-h-screen bg-gray-100 p-8">

  <!-- Page Title -->
  <div class="mb-8">
    <h1 class="text-4xl font-bold text-gray-800">Browse Courses</h1>
    <p class="text-gray-500 mt-2">Find the best courses to improve your skills</p>
  </div>

  <!-- Search + Filter -->
  

  <!-- Courses Grid -->
  <div class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">

    <!-- Course Card -->
    <div *ngFor="let course of courses" class="bg-white rounded-2xl shadow-lg overflow-hidden hover:shadow-2xl transform hover:-translate-y-2 transition">

      <img
        [src]="'http://localhost:8000/assets/images/' +course.image"
        alt="Course"
        class="w-full h-48 object-cover"
      />

      <div class="p-5">

        <h3 class="text-xl font-semibold text-gray-800 mb-2">
          {{course.title}}
        </h3>

        <p class="text-gray-500 text-sm mb-4">
          {{course.description}}
        </p>

        <div class="flex justify-between items-center">

          <span class="text-teal-600 font-bold text-lg">
            ${{course.price}}
          </span>

          <button
            [routerLink]="['/viewcourse',course.id]"
            class="bg-teal-500 text-white px-4 py-2 rounded-lg hover:bg-teal-600 transition">
            View Course
          </button>

        </div>

      </div>

    </div>

    <!-- Duplicate this card later with *ngFor -->

  </div>

</div>
