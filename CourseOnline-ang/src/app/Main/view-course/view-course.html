<div class="min-h-screen bg-gray-100 p-8">

  <div *ngFor="let c of course" class="max-w-6xl mx-auto bg-white rounded-2xl shadow-xl p-8">
    <button
          routerLink="/browsecourses" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg mb-4">
            back
          </button>
    <!-- Course Header -->
    <div  class="grid md:grid-cols-2 gap-8 items-center">

      <!-- Course Image -->
      <div>
        <img [src]="'http://localhost:8000/assets/images/' +c.image"
              class="rounded-2xl w-full h-72 object-cover shadow-lg" alt="Course Image">
      </div>

      <!-- Course Info -->
      <div>

        <h1 class="text-4xl font-bold text-gray-800 mb-4">
          {{c.title}}
        </h1>

        <p class="text-gray-600 text-lg mb-6">
          {{c.description}}
        </p>

        <!-- Admin Button -->
        <button
        [routerLink]="['/admin/createvideo', c.id]"
        *ngIf="auth.isAdmin()"
        class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-semibold transition">
          + Create Video
        </button>
        

      </div>

    </div>

    <!-- Divider -->
    <div class="my-10 border-t"></div>

    <!-- Videos Section -->
    <div>

      <h2 class="text-2xl font-bold text-gray-800 mb-6">
        Course Videos
      </h2>

      <div class="space-y-4">

        <!-- Video Card -->
        <div *ngFor="let video of c.videos" class="flex justify-between items-center bg-gray-50 p-4 rounded-xl shadow-sm">
          <div>
            <h3 class="font-semibold text-gray-800">{{video.title}}</h3>
            <p class="text-gray-500 text-sm">{{video.description}}</p>
          </div>
          <button
          [routerLink]="['/viewvideo',video.id]" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg">
            Watch
          </button>
        </div>


      </div>

    </div>

  </div>

</div>
