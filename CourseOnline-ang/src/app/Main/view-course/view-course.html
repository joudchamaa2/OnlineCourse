<div class="min-h-screen bg-gray-50 p-6 md:p-12">

  <div  class="max-w-5xl mx-auto mb-12">

    <!-- Back Button -->
    <div class="mb-6">
      <button
        routerLink="/browsecourses"
        class="bg-gray-700 hover:bg-gray-800 text-white px-5 py-2 rounded-lg font-medium transition duration-300">
        ← Back
      </button>
    </div>

    <!-- Course Card -->
    <div class="bg-white rounded-3xl shadow-lg overflow-hidden">
      <div class="md:flex md:items-center md:space-x-8">

        <!-- Course Image -->
        <div class="md:w-1/2 overflow-hidden rounded-2xl">
          <img
            [src]="'http://localhost:8000/assets/images/' + course.image"
            class="w-full h-72 md:h-full object-cover transform hover:scale-105 transition duration-500"
            alt="Course Image"
          />
        </div>

        <!-- Course Info -->
        <div class="md:w-1/2 p-6 flex flex-col justify-center space-y-6">
          <h1 class="text-3xl md:text-4xl font-bold text-gray-900">{{ course.title }}</h1>
          <p class="text-gray-600 text-lg">{{ course.description }}</p>

          <button
            *ngIf="auth.isInstructor()"
            [routerLink]="['/admin/createvideo', course.id]"
            class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-semibold transition shadow-md">
            + Create Video
          </button>
          <button
            *ngIf="auth.isInstructor()"
            [routerLink]="['/quiz' , course.id]"
            class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-semibold transition shadow-md">
            + Create Quiz
          </button>
        </div>

      </div>

      <!-- Videos Section -->
      <div class="p-6 md:p-8">
        <h2 class="text-2xl md:text-3xl font-bold text-gray-900 mb-6">Course Videos</h2>
        <div class="space-y-4">

          <div *ngFor="let video of course.videos"
               class="flex flex-col md:flex-row justify-between items-start md:items-center bg-gray-50 p-4 rounded-xl shadow hover:shadow-md transition cursor-pointer">

            <div class="flex-1 mb-3 md:mb-0">
              <h3 class="font-semibold text-gray-800 text-lg">{{ video.title }}</h3>
              <p class="text-gray-500 text-sm">{{ video.description }}</p>
            </div>

            <button
              [routerLink]="['/viewvideo', video.id]"
              class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-lg font-medium transition shadow-md">
              Watch
            </button>

          </div>

        </div>
      </div>
     <div class="flex justify-end mt-8 mb-8 mr-8">
  <button
    [routerLink]="['/Quiz', course.id]"
    class="flex items-center gap-2 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white px-6 py-3 rounded-full font-semibold shadow-lg hover:shadow-xl transition duration-300">

    <!-- Icon -->
    <span class="text-lg">📝</span>

    Take Quiz
  </button>
</div>



    </div>

  </div>

</div>
