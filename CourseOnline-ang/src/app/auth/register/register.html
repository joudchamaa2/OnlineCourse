<div class="min-h-screen flex items-center justify-center bg-gray-900">
  <div class="bg-gray-800 p-10 rounded-3xl shadow-2xl w-full max-w-md">
    

    <h2 class="text-3xl font-bold text-white mb-6 text-center">Create Account</h2>
    <p class="text-gray-400 mb-8 text-center">Sign up to get started</p>


    <form (ngSubmit)="sendRegister()">

      <div class="mb-4">
        <label for="name" class="block text-gray-400 mb-2">Full Name</label>
        <input type="text" [(ngModel)]="register.name" name="name" id="name" placeholder="John Doe"
                class="w-full px-4 py-3 rounded-lg bg-gray-700 border border-gray-600 text-white 
                focus:border-teal-500 focus:ring-1 focus:ring-teal-500 outline-none transition" />
      </div>


      <div class="mb-4">
        <label for="email"  class="block text-gray-400 mb-2">Email</label>
        <input type="email" name="email" [(ngModel)]="register.email" id="email" placeholder="you@example.com"
               class="w-full px-4 py-3 rounded-lg bg-gray-700 border border-gray-600 text-white 
               focus:border-teal-500 focus:ring-1 focus:ring-teal-500 outline-none transition" />
      </div>

      <div class="mb-4">
        <label for="password"  class="block text-gray-400 mb-2">Password</label>
        <input type="password" name="password" [(ngModel)]="register.password" id="password" placeholder="********"
               class="w-full px-4 py-3 rounded-lg bg-gray-700 border border-gray-600 text-white 
               focus:border-teal-500 focus:ring-1 focus:ring-teal-500 outline-none transition" />
      </div>


      <button type="submit"
              class="w-full bg-teal-500 text-gray-900 py-3 rounded-xl font-semibold hover:bg-orange-500 transition">
        Sign Up
      </button>
    </form>


    <p class="text-gray-400 mt-6 text-center">
      Already have an account?
      <a routerLink="/login" class="text-teal-500 hover:underline">Sign In</a>
    </p>
  </div>
</div>
