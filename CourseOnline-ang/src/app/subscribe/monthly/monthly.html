<div class="min-h-screen bg-gray-100 flex items-center justify-center p-6">

  <div class="bg-white shadow-2xl rounded-2xl p-8 w-full max-w-lg">
    <!-- Page Title -->
    <h2 class="text-3xl font-bold text-gray-800 mb-6">
      Add Subscription
    </h2>

    <form class="space-y-6" (ngSubmit)="subscribe()">
        

      <!-- Hidden Plan Type -->
      <input type="hidden" ({ngModel})="plan.subscription_type" value="monthly">


      <!-- Payment Info -->
      <div>
        <label for="payment-method" class="block text-gray-700 font-medium mb-2">
          Payment Method
        </label>
        <select 
          id="payment-method"
          name="payment_method"
          class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500"
        >
          <option value="">Select a method</option>
          <option value="credit_card">Credit Card</option>
          <option value="paypal">PayPal</option>
          <option value="bank_transfer">Bank Transfer</option>
        </select>
      </div>
      <div>
      <label class="block text-gray-700 font-medium mb-2">
          Number Card
        </label>
        <input
          type="text"
          name="number"
          placeholder="xxxx-yyyy-zzzz"
          class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500"
        />
        </div>
        <div>
        <label class="block text-gray-700 font-medium mb-1">
          CVV
        </label>
        <input
          type="text"
          name="cvv"
          placeholder="xxx"
          class="w-20 border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500"
        />
        </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="w-full bg-teal-500 text-white py-3 rounded-xl font-semibold hover:bg-teal-600 transition"
      >
        Add Subscription
      </button>
      <p class="text-red-700">{{message}}</p>

    </form>

  </div>

</div>
