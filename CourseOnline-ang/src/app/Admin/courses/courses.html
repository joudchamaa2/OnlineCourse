<div class="flex-1 p-8 bg-gray-100 min-h-screen">

  <h1 class="text-3xl font-bold mb-6 text-gray-800">
    All Courses
  </h1>

  <div class="bg-white rounded-2xl shadow-lg p-6 overflow-x-auto">

    <table class="w-full text-left border-collapse">

      <thead>
        <tr class="bg-gray-200 text-gray-700">
          <th class="p-4">Image</th>
          <th class="p-4">Title</th>
          <th class="p-4">Category</th>
          <th class="p-4">Price</th>
          <th class="p-4 text-center">Actions</th>
        </tr>
      </thead>

      <tbody>

        <!-- Course 1 -->
        @for (course of courses; track course.id) {
          <tr class="border-b hover:bg-gray-50">
            <td class="p-4">
              @if (course.image) {
                <img [src]="'http://localhost:8000/assets/images/' + course.image"
                  alt="Course thumbnail"
                  class="w-16 h-16 object-cover rounded-lg" />
              } @else {
                <div class="w-16 h-16 bg-gray-300 rounded-lg flex items-center justify-center text-gray-500">No image</div>
              }
            </td>
          
          <td class="p-4 font-medium text-gray-800">
            {{course.title}}
          </td>
          <td class="p-4 text-gray-600">
            {{course.category}}
          </td>
          <td class="p-4 text-teal-600 font-semibold">
            ${{course.price}}
          </td>
          <td class="p-4 text-center space-x-2">
            <a [routerLink]="['/admin/editcourse',course.id]"
              class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">
              Edit
          </a>
            <button (click)="delete(course.id)"
              class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition">
              Delete
            </button>
          </td>
          </tr>
        }

      </tbody>

    </table>

  </div>

</div>
