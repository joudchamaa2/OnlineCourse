<div class="flex-1 flex flex-col">

    <!-- Topbar -->
    <header class="bg-white shadow-md p-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-gray-700">
        Dashboard
      </h1>

      <div class="flex items-center space-x-4">
        <span class="text-gray-600 font-medium">
          Admin
        </span>

        <div class="w-10 h-10 bg-gray-300 rounded-full"></div>
      </div>
    </header>

    <!-- Dashboard Content -->
    

  </div>
  <main class="p-8">

      <!-- Cards -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

        <div class="bg-white p-6 rounded-2xl shadow-md">
          <h2 class="text-lg font-semibold text-gray-600">Total Users</h2>
          <p class="text-3xl font-bold mt-4 text-gray-800">{{user}}</p>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-md">
          <h2 class="text-lg font-semibold text-gray-600">Total Courses</h2>
          <p class="text-3xl font-bold mt-4 text-gray-800">45</p>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-md">
          <h2 class="text-lg font-semibold text-gray-600">Revenue</h2>
          <p class="text-3xl font-bold mt-4 text-green-600">$8,540</p>
        </div>

      </div>

      <!-- Table Section -->
      <div class="mt-10 bg-white p-6 rounded-2xl shadow-md">
        <h2 class="text-xl font-semibold mb-4">Recent Users</h2>

        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b">
              <th class="py-2">Name</th>
              <th>Email</th>
              <th>Role</th>
            </tr>
          </thead>
          <tbody>
            
            <tr *ngFor="let user of tuser" class="border-b hover:bg-gray-50">
              <td class="py-2">{{user.name}}</td>
              <td>{{user.email}}</td>
              <td>{{user.role}}</td>
            </tr>
          </tbody>
        </table>

      </div>

    </main>
