<div class="flex-1 p-8 bg-gray-100 min-h-screen">

  <h1 class="text-3xl font-bold mb-6 text-gray-800">
    Edit Course
  </h1>

  <div class="bg-white rounded-2xl shadow-lg p-8 max-w-3xl">

    <form (ngSubmit)="update()">

      <!-- Course Title -->
      <div class="mb-5">
        <label class="block text-gray-700 mb-2 font-medium">
          Course Title
        </label>
        <input
          name="title"
          type="text"
          placeholder="Enter course title"
          [(ngModel)]="course.title"
          class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500"
        />
      </div>

      <!-- Description -->
      <div class="mb-5">
        <label class="block text-gray-700 mb-2 font-medium">
          Description
        </label>
        <textarea
        name="description"
          [(ngModel)]="course.description"
          rows="4"
          placeholder="Enter course description"
          class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500"
        >{{course.description}}</textarea>
      </div>

      <!-- Price -->
      <div class="mb-5">
        <label class="block text-gray-700 mb-2 font-medium">
          Price
        </label>
        <input
        name="price"
          type="number"
          placeholder="Enter price"
          [(ngModel)]="course.price"
          class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500"
        />
      </div>

      <!-- Category -->
      <div class="mb-5">
        <label class="block text-gray-700 mb-2 font-medium">
          Category
        </label>
         <input
         name="category"
          type="text"
          placeholder="enter category"
          [(ngModel)]="course.category"
          class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500"
        />
      
      </div>

      <!-- Current Image -->
      <div class="mb-5">
        <label class="block text-gray-700 mb-2 font-medium">
          Current Image
        </label>

        <img
          [src]="'http://localhost:8000/assets/images/' + course.image"
          alt="Course Image"
          class="w-48 h-28 object-cover rounded-lg shadow"
        />
      </div>

      <!-- Change Image -->
      <div class="mb-6">
        <label class="block text-gray-700 mb-2 font-medium">
          Change Image
        </label>
        <input
          type="file"
          name="image"
          (change)="onFileChange($event)"
          aria-label="Choose a new image"
          class="w-full border rounded-lg px-4 py-2"
        />
      </div>

      <!-- Buttons -->
      <div class="flex justify-end space-x-4">

        <a
          routerLink="/admin/courses"
          class="px-6 py-3 bg-gray-400 text-white rounded-lg hover:bg-gray-500 transition">
          Cancel
        </a>

        <button
        
          type="submit"
          class="px-6 py-3 bg-teal-500 text-white rounded-lg hover:bg-teal-600 transition">
          Update Course
        </button>

      </div>
      <div>
        <p class="text-green-600 mt-4">
          {{ message }}
        </p>
      </div>

    </form>

  </div>

</div>
