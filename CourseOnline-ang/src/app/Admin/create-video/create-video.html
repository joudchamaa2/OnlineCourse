<div class="min-h-screen bg-gray-100 flex items-center justify-center p-6">

  <div class="bg-white shadow-2xl rounded-2xl p-8 w-full max-w-xl">

    <!-- Page Title -->
    <h2 class="text-3xl font-bold text-gray-800 mb-6">
      Upload Course Video
    </h2>

    <form #form="ngForm" class="space-y-6" (ngSubmit)="create()">

      <!-- Video Title -->
      <div>
        <label class="block text-gray-700 font-medium mb-2">
          Video Title
        </label>
        <input
          [(ngModel)]="video.title"
          name="title"
          type="text"
          placeholder="Enter video title"
          class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500"
        />
      </div>

      <!-- Description -->
      <div>
        <label class="block text-gray-700 font-medium mb-2">
          Description
        </label>
        <textarea
          [(ngModel)]="video.description"
          name="description"
          rows="4"
          placeholder="Enter video description"
          class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500"
        ></textarea>
      </div>

      <!-- Video Upload -->
      <div>
        <label class="block text-gray-700 font-medium mb-2">
          Upload Video
        </label>

        <input
          type="file"
          (change)="onFileChange($event)"
          accept="video/*"
          title="Select a video file to upload"
          class="w-full border border-gray-300 rounded-xl px-4 py-3 bg-gray-50 cursor-pointer"
        />
      </div>

      <!-- Submit Button -->
      <div class="flex gap-4">
        <button
          type="submit"
          class="flex-1 bg-teal-500 text-white py-3 rounded-xl font-semibold hover:bg-teal-600 transition"
        >
          Upload Video
        </button>
        <button
          type="button"
          [routerLink]="['/viewcourse',id]"
          class="flex-1 bg-gray-500 text-white py-3 rounded-xl font-semibold hover:bg-gray-600 transition"
        >
          Cancel
        </button>
      </div>

    </form>

  </div>

</div>
