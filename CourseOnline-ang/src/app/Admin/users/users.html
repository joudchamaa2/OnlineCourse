<div class="p-8 bg-gray-100 min-h-screen">

  <h1 class="text-3xl font-bold mb-6 text-gray-700">Manage Users</h1>

  <!-- Users Table -->
  <div class="bg-white shadow-lg rounded-xl overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            Name
          </th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            Email
          </th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            Role
          </th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            Actions
          </th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">

        <!-- Example row -->
        <tr *ngFor="let users of user" class="hover:bg-gray-50">
          <td class="px-6 py-4 whitespace-nowrap text-gray-800 font-medium">
            {{users.name}}
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-gray-600">
            {{users.email}}
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-gray-600">
            {{users.role}}
          </td>
          <td class="px-6 py-4 whitespace-nowrap flex space-x-2">

            <a [routerLink]="['/admin/editUser',users.id]"
              class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">
              Edit
            </a>

            <button (click)="delete(users.id)"
              class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition">
              Delete
            </button>

          </td>
        </tr>


      </tbody>
    </table>
  </div>


</div>
