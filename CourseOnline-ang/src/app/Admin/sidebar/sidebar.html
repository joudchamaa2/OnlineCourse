<!-- Sidebar -->
  <aside class="w-64 h-full bg-gray-900  text-white flex flex-col ">

    <div class="p-6 text-2xl font-bold border-b border-gray-700">
      Admin Panel
    </div>

    <nav class="p-4 space-y-2">

      <a routerLink="/admin"
         class="block px-4 py-2 rounded-lg hover:bg-gray-700 transition">
        Dashboard
      </a>

      <a routerLink="/admin/users"
         class="block px-4 py-2 rounded-lg hover:bg-gray-700 transition">
        Users
      </a>

      <a routerLink="/admin/courses"
         class="block px-4 py-2 rounded-lg hover:bg-gray-700 transition">
        Courses
      </a>

      <a routerLink="/admin/settings"
         class="block px-4 py-2 rounded-lg hover:bg-gray-700 transition">
        Settings
      </a>

    </nav>

    <div class="p-4 border-t border-gray-700 ">
      <button (click)="onLogout()"
        class="w-full bg-red-500 hover:bg-red-600 py-2 rounded-lg transition">
        Logout
      </button>
    </div>

  </aside>
