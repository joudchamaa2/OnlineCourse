<div class="min-h-screen bg-gray-100 p-8">

  <!-- Page Title -->
  <h1 class="text-4xl font-bold text-gray-800 mb-8">
    Manage Videos
  </h1>


  <!-- Videos Table -->
  <div class="bg-white shadow-lg rounded-2xl overflow-hidden">

    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Title</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Description</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Course</th>
          <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">

        <!-- Example Video Row -->
        <tr class="hover:bg-gray-50" *ngFor="let v of video">
          <td class="px-6 py-4 whitespace-nowrap text-gray-800 font-medium">{{v.title}}</td>
          <td class="px-6 py-4 whitespace-nowrap text-gray-600">{{v.description}}</td>
          <td class="px-6 py-4 whitespace-nowrap text-gray-800">{{v.course.title}}</td>
          <td class="px-6 py-4 whitespace-nowrap text-center space-x-2">
            <button
            [routerLink]="['/admin/editvideo',v.id]" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg">
              Edit
            </button>
            <button
            (click)="delete(v.id)" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg">
              Delete
            </button>
          </td>
        </tr>
        <p class="text-red-700"></p>

        <!-- Repeat rows with *ngFor in Angular -->

      </tbody>
    </table>

  </div>

</div>
