<div class="bg-gray-900 text-white min-h-screen">

  

  <!-- Hero Section -->
  <section class="relative bg-gray-900 flex flex-col-reverse md:flex-row items-center justify-between px-8 md:px-20 py-20">
    <!-- Text -->
    <div class="md:w-1/2 mt-10 md:mt-0">
      <h1 class="text-5xl md:text-6xl font-bold mb-6 leading-tight">Learn Modern Skills Online</h1>
      <p class="text-gray-400 text-lg md:text-xl mb-8">Join thousands of students worldwide learning programming, design, and more.</p>
      <div class="flex gap-4">
        <button
        routerLink="/subscribe"
        class="bg-teal-500 text-gray-900 px-6 py-4 rounded-xl font-semibold hover:bg-orange-500 transition text-lg">
          Get Started
        </button>
        <a routerLink="/browsecourses" class="border-2 border-teal-500 text-teal-500 px-6 py-4 rounded-xl font-semibold hover:bg-teal-500 hover:text-gray-900 transition text-lg">
          Browse Courses
        </a>
      </div>
    </div>
    <div class="md:w-1/2 flex justify-center">
      <img [src]="'http://localhost:8000/assets/images/' + image"
           alt="Learning Online" class="rounded-3xl shadow-2xl w-full max-w-lg" />
    </div>
  </section>
  <!-- Featured Courses -->
  <section class="py-24 px-8 md:px-20">
    <h2 class="text-4xl font-bold mb-12 text-center">Featured Courses</h2>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
      <!-- Course Card -->
      <div class="bg-gray-800 rounded-3xl shadow-lg hover:shadow-2xl transform hover:-translate-y-3 transition overflow-hidden" *ngFor="let c of course">
        <img [src]="'http://localhost:8000/assets/images/' + c.image"
             alt="Course 1" class="w-full h-52 object-cover" />
        <div class="p-6">
          <h3 class="text-2xl font-semibold mb-2">{{c.title}}</h3>
          <p class="text-gray-400 mb-4">{{c.description}}</p>
          <button 
          [routerLink]="['/viewcourse',c.id]"
          class="bg-teal-500 text-gray-900 px-4 py-2 rounded-lg font-semibold hover:bg-orange-500 transition">
            View Course
          </button>
        </div>
      </div>


    </div>
  </section>

  <!-- Call-to-Action -->
  <section class="bg-gray-800 py-24 px-8 md:px-20 text-center rounded-t-3xl">
    <h2 class="text-4xl font-bold mb-4">Start Learning Today</h2>
    <p class="text-teal-500 mb-8 text-lg">Join thousands of students worldwide and upgrade your skills</p>
    <button
    routerLink="/subscribe"
    class="bg-teal-500 text-gray-900 px-8 py-4 rounded-xl font-semibold hover:bg-orange-500 transition text-lg">
      Join Now
    </button>
  </section>
